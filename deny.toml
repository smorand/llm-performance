# cargo-deny configuration — enforced by `make security` (cargo-deny 0.20+).

[advisories]
yanked       = "deny"
unmaintained = "workspace"   # fail only on unmaintained direct deps
# All vulnerability/unsound/notice advisories always error (no knob needed).
# ignore = [
#   { id = "RUSTSEC-0000-0000", reason = "not reachable on our code path" },
# ]

[bans]
multiple-versions = "warn"
wildcards         = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Mozilla root certificate data (not code) shipped by webpki-root-certs,
    # pulled in transitively via reqwest -> rustls-platform-verifier.
    # Permissive, no copyleft clause.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
