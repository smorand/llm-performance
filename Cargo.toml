[workspace]
members  = ["crates/core", "crates/llm-performance"]
resolver = "3"

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
license      = "MIT"
authors      = ["Sebastien MORAND <seb.morand@gmail.com>"]
repository   = "https://github.com/sebastienmorand/llm-performance"

[workspace.dependencies]
tokio                 = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time", "fs"] }
tokio-util            = { version = "0.7", features = ["rt"] }
clap                  = { version = "4.6", features = ["derive", "env"] }
axum                  = "0.8"
tower                 = "0.5"
tower-http            = { version = "0.7", features = ["trace", "timeout", "limit", "sensitive-headers", "compression-gzip", "cors"] }
etcetera              = "0.11"
bytes                 = "1"
reqwest               = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "gzip", "http2"] }
regex                 = "1"
base64                = "0.22"
time                  = { version = "0.3", features = ["formatting", "parsing"] }
serde                 = { version = "1", features = ["derive"] }
serde_json            = "1"
schemars              = "1"
figment               = { version = "0.10", features = ["toml", "env"] }
thiserror             = "2"
anyhow                = "1"
tracing               = "0.1"
tracing-subscriber    = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender      = "0.2"
tracing-opentelemetry = "0.33"
opentelemetry         = "0.32"
opentelemetry_sdk     = "0.32"
opentelemetry-otlp    = { version = "0.32", features = ["grpc-tonic"] }
tonic                 = { version = "0.14", default-features = false }
clap-verbosity-flag   = { version = "3", default-features = false, features = ["tracing"] }
futures-util          = "0.3"
assert_cmd            = "2"
predicates            = "3"

[workspace.lints.rust]
unsafe_code           = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all      = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
doc_markdown            = "allow"
redundant_clone = "warn"
rc_buffer       = "warn"
mutex_atomic    = "warn"

[profile.release]
opt-level     = 3
lto           = "fat"
strip         = true
codegen-units = 1

[profile.release-dist]
inherits = "release"
panic    = "abort"

[profile.dev.package."*"]
opt-level = 3
